# Both baseline and SUT (Software Under Test) are built from source first [1],
# with their binaries uploaded as artifacts.
# This is done on GitHub infrastructure, to achieve maximum parallelization.
#
# The benchmark itself runs on a self-hosted runner which we completely control.
# That machine is not as steady as it sounds: its speed drifts over an hour, by 18 % in one
# observed run, so the two sides are measured alternately, one fork at a time, and never one
# after the other. Both then meet the same machine and the drift divides out of their ratio.
#
# A benchmark subjob produces no report of its own -
# it uploads one raw JMH result for each fork, which a merge step joins into the single-entry file
# the report expects. That merge, not JMH, computes the statistics: a fork keeps whatever shape it
# compiled for its whole life, so the fork is the unit, not the iteration.
# After every subjob finishes, one summarizing job downloads all of them and aggregates them into a single table,
# which is the only report this workflow produces.
#
# A row is judged on its delta against a fixed +/- 3 % band, and carries its resolution:
# the 99.9 % confidence interval on that delta, computed by pairing fork N of one side with fork N
# of the other. A row whose resolution is no better than the band could not have caught a
# regression worth failing on, and is marked as such.
#
# [1] Unless the baseline is a release tag, in which case its binaries are downloaded from a repository.
#
name: ScoreDirector Perf Regression Test
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      jdk_baseline:
        description: 'JDK version'
        default: '25'
        required: true
      baseline:
        description: 'Baseline branch or tag (branches need to use 999-SNAPSHOT)'
        default: 'v2.6.0'
        required: true
      jdk_branch:
        description: 'JDK version'
        default: '25'
        required: true
      branch:
        description: 'Branch to benchmark (needs to use 999-SNAPSHOT)'
        default: 'main'
        required: true
      branch_owner:
        description: 'User owning the branch'
        default: 'TimefoldAI'
        required: true

run-name: "TimefoldAI's ${{ github.event.inputs.baseline }} vs. ${{ github.event.inputs.branch_owner }}'s ${{ github.event.inputs.branch }} (Java ${{ github.event.inputs.jdk_baseline }} vs. ${{ github.event.inputs.jdk_branch }})"

jobs:
  decisions:
    runs-on: ubuntu-latest
    outputs:
      baseline_solver_version: ${{ steps.step1.outputs.version }}
      needs_snapshot_built: ${{ steps.step1.outputs.needs_snapshot_built }}
      examples: ${{ steps.step2.outputs.examples }}
    env:
      BASELINE: ${{ github.event.inputs.baseline }}
    steps:
      - name: Determine the baseline
        id: step1
        shell: bash
        run: |
          if [[ "$BASELINE" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            NEEDS_SNAPSHOT_BUILT=false
            echo "Baseline is a release tag ($VERSION)."
          else
            # We're testing against a tag.
            VERSION="999-SNAPSHOT"
            NEEDS_SNAPSHOT_BUILT=true
            echo "Baseline is a random branch."
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "needs_snapshot_built=$NEEDS_SNAPSHOT_BUILT" >> "$GITHUB_OUTPUT"

      # Single source of truth for the benchmark matrix and for the summarizing job.
      - name: Enumerate examples
        id: step2
        shell: bash
        run: |
          EXAMPLES='["cloud_balancing","conference_scheduling","curriculum_course","examination","flow_shop","machine_reassignment","meeting_scheduling","nurse_rostering","patient_admission_scheduling","task_assigning","traveling_tournament","vehicle_routing"]'
          echo "examples=$EXAMPLES" >> "$GITHUB_OUTPUT"

  build_baseline:
    needs: decisions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout timefold-solver-benchmarks
        uses: actions/checkout@v7
        with:
          repository: TimefoldAI/timefold-solver-benchmarks
          path: ./timefold-solver-benchmarks
          # Same commit for both baseline and SUT builds, so a harness-only change never confounds
          # the solver comparison. Pinning this to a fixed branch name meant a harness fix on any
          # other branch (incl. this one) was silently never exercised by this workflow; use the
          # commit that dispatched this run instead, whichever branch that happens to be.
          ref: ${{ github.sha }}

      - name: Setup JDK and Maven
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 25 # Always build with the least recent supported JDK.
          distribution: 'temurin'
          cache: 'maven'

      # Only build the snapshots if determined by the decisions job.
      - name: Checkout timefold-solver
        if: needs.decisions.outputs.needs_snapshot_built == 'true'
        uses: actions/checkout@v7
        with:
          repository: TimefoldAI/timefold-solver
          ref: ${{ github.event.inputs.baseline }}
          path: ./timefold-solver
      - name: Quickly build timefold-solver
        if: needs.decisions.outputs.needs_snapshot_built == 'true'
        working-directory: ./timefold-solver
        shell: bash
        run: ./mvnw -B -Dquickly clean install
      - name: Checkout timefold-solver-enterprise
        if: needs.decisions.outputs.needs_snapshot_built == 'true'
        uses: actions/checkout@v7
        with:
          repository: TimefoldAI/timefold-solver-enterprise
          ref: ${{ github.event.inputs.baseline }}
          token: ${{ secrets.BENCHMARK_PUBLISH_TOKEN }}
          path: ./timefold-solver-enterprise
      - name: Quickly build timefold-solver-enterprise
        if: needs.decisions.outputs.needs_snapshot_built == 'true'
        working-directory: ./timefold-solver-enterprise
        shell: bash
        run: ./mvnw -B -Dquickly clean install

      - name: Switch to correct Benchmarks branch if it exists
        if: needs.decisions.outputs.needs_snapshot_built == 'true'
        working-directory: ./timefold-solver-benchmarks
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.inputs.baseline }}
        run: |
          # Match a branch OR a tag named $TARGET_BRANCH (no --heads): baseline is often a tag
          # (e.g. a release version). Falls back to the already-checked-out default if no match exists.
          # Skip for "main": that's the common default solver ref, not a deliberate companion
          # harness branch, and timefold-solver-benchmarks always has its own "main" too - matching
          # on it would silently discard the commit checked out above (the one dispatching this
          # run) and revert to origin/main, undoing that checkout for every ordinary run.
          if [ "$TARGET_BRANCH" != "main" ] && git ls-remote --exit-code origin "$TARGET_BRANCH" > /dev/null; then
            git fetch --depth=1 origin "$TARGET_BRANCH"
            git checkout -B "$TARGET_BRANCH" FETCH_HEAD
          fi
          git status
      - name: Compile the benchmark
        working-directory: ./timefold-solver-benchmarks
        shell: bash
        env:
          VERSION: ${{ needs.decisions.outputs.baseline_solver_version }}
        run: |
          ./mvnw clean install -B -Dquickly -Dversion.ai.timefold.solver=$VERSION
          mv target/benchmarks.jar ../benchmarks-baseline.jar

      - name: Upload the binary
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-baseline
          path: |
            ./benchmarks-baseline.jar
          if-no-files-found: error

  build_sut:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout timefold-solver-benchmarks
        uses: actions/checkout@v7
        with:
          repository: TimefoldAI/timefold-solver-benchmarks
          path: ./timefold-solver-benchmarks
          # Same commit for both baseline and SUT builds, so a harness-only change never confounds
          # the solver comparison. Pinning this to a fixed branch name meant a harness fix on any
          # other branch (incl. this one) was silently never exercised by this workflow; use the
          # commit that dispatched this run instead, whichever branch that happens to be.
          ref: ${{ github.sha }}

      - name: Setup JDK and Maven
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 25 # Always build with the least recent supported JDK.
          distribution: 'temurin'
          cache: 'maven'

      - name: Checkout timefold-solver
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.inputs.branch_owner }}/timefold-solver
          ref: ${{ github.event.inputs.branch }}
          path: ./timefold-solver
      - name: Quickly build timefold-solver
        working-directory: ./timefold-solver
        shell: bash
        run: ./mvnw -B -Dquickly clean install

      # Clone timefold-solver-enterprise
      - name: Checkout timefold-solver-enterprise
        uses: actions/checkout@v7
        with:
          repository: TimefoldAI/timefold-solver-enterprise
          ref: main
          token: ${{ secrets.BENCHMARK_PUBLISH_TOKEN }}
          path: ./timefold-solver-enterprise
      - name: Switch to correct Enterprise branch if it exists
        working-directory: ./timefold-solver-enterprise
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          # Match a branch OR a tag named $TARGET_BRANCH (no --heads): the branch under test may
          # also be a tag. Falls back to the already-checked-out `main` if no match exists.
          if git ls-remote --exit-code origin "$TARGET_BRANCH" > /dev/null; then
            git fetch --depth=1 origin "$TARGET_BRANCH"
            git checkout -B "$TARGET_BRANCH" FETCH_HEAD
          fi
          git status
      - name: Quickly build timefold-solver-enterprise
        working-directory: ./timefold-solver-enterprise
        shell: bash
        run: ./mvnw -B -Dquickly clean install

      # Sometimes changes may be incompatible with the tag.
      # If the branch doesn't exist, we assume that the changes are compatible and move on.
      - name: Switch to correct Benchmarks branch if it exists
        working-directory: ./timefold-solver-benchmarks
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          # Match a branch OR a tag named $TARGET_BRANCH (no --heads): the branch under test may
          # also be a tag. Falls back to the already-checked-out default if no match exists.
          # Skip for "main": that's the common default solver ref, not a deliberate companion
          # harness branch, and timefold-solver-benchmarks always has its own "main" too - matching
          # on it would silently discard the commit checked out above (the one dispatching this
          # run) and revert to origin/main, undoing that checkout for every ordinary run.
          if [ "$TARGET_BRANCH" != "main" ] && git ls-remote --exit-code origin "$TARGET_BRANCH" > /dev/null; then
            git fetch --depth=1 origin "$TARGET_BRANCH"
            git checkout -B "$TARGET_BRANCH" FETCH_HEAD
          fi
          git status
      - name: Compile the benchmarks
        working-directory: ./timefold-solver-benchmarks
        shell: bash
        run: |
          ./mvnw clean install -B -Dquickly
          mv target/benchmarks.jar ../benchmarks-sut.jar

      - name: Upload the binary
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-sut
          path: |
            ./benchmarks-sut.jar
          if-no-files-found: error

  benchmark:
    concurrency:
      group: perf-score_director-${{ matrix.example }}
      cancel-in-progress: true
    needs: [ decisions, build_baseline, build_sut ]
    runs-on: ubuntu-24.04-arm # Github-hosted Arm runner; free and GA for this public repo.
    timeout-minutes: 300
    strategy:
      fail-fast: false # Jobs fail if the benchmark error is over predefined thresholds; other benchmarks continue.
      matrix:
        example: ${{ fromJSON(needs.decisions.outputs.examples) }}
    steps:
      - name: Clean results of previous runs
        shell: bash
        env:
          BASELINE: ${{ github.event.inputs.baseline }}
          BRANCH: ${{ github.event.inputs.branch }}
        run: |
          rm -rf timefold-solver-benchmarks
          # GitHub expressions can't do this, so we need to hack this in shell.
          # DIRs are different, so that we can run "main" against "main" and have separate results.
          # Strip CR/LF from inputs before writing to $GITHUB_ENV to prevent env-file injection.
          SANITIZED_BASELINE=$(echo "$BASELINE" | tr -d '\r\n' | sed 's/\//\-/g')
          SANITIZED_BRANCH=$(echo "$BRANCH" | tr -d '\r\n' | sed 's/\//\-/g')
          {
            echo "BASELINE_DIR=baseline_$SANITIZED_BASELINE"
            echo "SUT_DIR=sut_$SANITIZED_BRANCH"
          } >> "$GITHUB_ENV"

      - name: Checkout timefold-solver-benchmarks
        uses: actions/checkout@v7
        with:
          repository: TimefoldAI/timefold-solver-benchmarks
          path: ./timefold-solver-benchmarks
          # The harness and the binaries have to come from one commit, for the same reason
          # build_baseline gives: pinned to a branch, a harness fix on any other branch
          # was silently never exercised by this workflow.
          ref: ${{ github.sha }}

      - name: Configure the benchmark
        working-directory: ./timefold-solver-benchmarks
        shell: bash
        env:
          EXAMPLE: ${{ matrix.example }}
        run: |
          # - One fork for each invocation, on purpose.
          #  The two sides are measured alternately, one fork at a time, so that the machine's
          #  slow wander lands on both of them equally. It is the largest source of noise here:
          #  in three main-against-main runs the fork means carried a lag-1 autocorrelation of
          #  up to +0.43, one baseline had three neighbouring forks 25-33 % fast,
          #  and another had its whole block sitting below the other side's.
          #  Running one side to completion and then the other gave those a free hand;
          #  alternating cut the spread of the difference from 1.3 % to 0.5 %.
          #  The fork count therefore lives in FORK_COUNT below, not here.
          # - One measurement iteration for each fork, on purpose.
          #  A JVM keeps the shape it compiled for its whole life,
          #  so the five iterations inside a fork were five copies of one sample.
          #  JMH divides the spread of all of them by the square root of their count,
          #  which made the reported error about 2.1x too small.
          #  With one iteration for each fork, every sample is its own JVM.
          # - Six warmup iterations, not five.
          #  flow_shop and machine_reassignment were still 1 % below their steady speed
          #  in the first measurement iteration, and that iteration is now the only one.
          echo "forks=1" > scoredirector-benchmark.properties
          echo "warmup_iterations=6" >> scoredirector-benchmark.properties
          echo "measurement_iterations=1" >> scoredirector-benchmark.properties
          # Only a console warning from Main, about one side's own spread. It is not what decides
          # whether a row can be trusted - that is the report's resolution column, which pairs the
          # two sides and so ignores the machine drift that dominates a single side's spread.
          # Set loosely enough that it speaks up only when a side is genuinely wild.
          echo "relative_score_error_threshold=0.05" >> scoredirector-benchmark.properties
          echo "score_director_type=cs" >> scoredirector-benchmark.properties
          echo "example=$EXAMPLE" >> scoredirector-benchmark.properties
          cat scoredirector-benchmark.properties
          chmod +x run-scoredirector.sh
          # How many forks each side gets, spent one at a time by the loop below.
          echo "FORK_COUNT=26" >> "$GITHUB_ENV"

      - name: Download the baseline binary
        uses: actions/download-artifact@v8
        with:
          name: benchmarks-baseline
          path: ./timefold-solver-benchmarks
      - name: Download the SUT binary
        uses: actions/download-artifact@v8
        with:
          name: benchmarks-sut
          path: ./timefold-solver-benchmarks

      # Both JDKs are installed before the benchmark, because the loop below switches between them
      # for every fork and a step-level action cannot run inside a loop.
      - name: (Baseline) Setup JDK and Maven
        uses: actions/setup-java@v6.0.1
        with:
          java-version: ${{ github.event.inputs.jdk_baseline }}
          distribution: 'temurin'
          check-latest: true
      - name: (Baseline) Record the JDK
        shell: bash
        run: echo "JAVA_HOME_BASELINE=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: (SUT) Setup JDK and Maven
        uses: actions/setup-java@v6.0.1
        with:
          java-version: ${{ github.event.inputs.jdk_branch }}
          distribution: 'temurin'
          check-latest: true
      - name: (SUT) Record the JDK
        shell: bash
        run: echo "JAVA_HOME_SUT=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Verify the JDKs
        shell: bash
        env:
          JDK_BASELINE: ${{ github.event.inputs.jdk_baseline }}
          JDK_BRANCH: ${{ github.event.inputs.jdk_branch }}
        run: |
          # Fail now rather than benchmark the wrong JVM for an hour.
          check_jdk() { # label, java home, requested major version
            if [ -z "$2" ] || [ ! -x "$2/bin/java" ]; then
              echo "::error::The $1 JDK is missing at '$2'."
              exit 1
            fi
            # java.specification.version is a bare major version; the -version banner is not.
            ACTUAL=$("$2/bin/java" -XshowSettings:properties -version 2>&1 \
                | sed -n 's/.*java\.specification\.version = //p' | tr -d '[:space:]')
            if [ "$ACTUAL" != "$3" ]; then
              echo "::error::The $1 JDK is $ACTUAL, but $3 was requested."
              exit 1
            fi
            echo "$1 JDK $ACTUAL at $2"
          }
          check_jdk baseline "$JAVA_HOME_BASELINE" "$JDK_BASELINE"
          check_jdk sut "$JAVA_HOME_SUT" "$JDK_BRANCH"
          # setup-java hands back the same installation for the same version,
          # so the two may only differ when they were asked to.
          if [ "$JDK_BASELINE" != "$JDK_BRANCH" ] && [ "$JAVA_HOME_BASELINE" = "$JAVA_HOME_SUT" ]; then
            echo "::error::Different JDKs were requested, but both sides resolved to $JAVA_HOME_BASELINE."
            exit 1
          fi

      - name: Prepare the machine for profiling
        shell: bash
        run: |
          # The async profiler needs perf_event_paranoid at 1 or less to open perf events, and
          # kptr_restrict at 0 to resolve kernel symbols. Done once, here, rather than once for
          # every fork inside run-scoredirector.sh.
          # Neither has ever applied here. This is the only benchmark on self-hosted hardware, and
          # sudo on that image asks for a password no job can type. The recordings show both sides
          # of it: score-director JFRs carry engine="ctimer" and kernelSymbols="false", while
          # move-provider, which runs the same two commands on a Github-hosted runner, gets
          # engine="perf_events" and kernelSymbols="true".
          # The real fix is to write both values into /etc/sysctl.d on the runner image, so no sudo
          # is needed at benchmark time at all. Until then "sudo -n" at least fails immediately
          # rather than waiting on a prompt, and the warning below carries the reason.
          ensure_sysctl() { # key, wanted value, comparison
            # Try to set it, then report what the kernel actually holds - the attempt succeeding
            # is not the same as the value being right. Carry sudo's own complaint into the
            # warning, flattened to one line, because that names the reason.
            REASON=$(sudo -n sysctl -q "$1=$2" 2>&1 | tr '\n' ' ') || true
            ACTUAL=$(cat "/proc/sys/${1//.//}" 2>/dev/null || echo unknown)
            if [ "$ACTUAL" != unknown ] && [ "$ACTUAL" -"$3" "$2" ] 2>/dev/null; then
              echo "$1 = $ACTUAL"
            else
              echo "::warning::$1 is $ACTUAL, not $2; the profiler falls back to its ctimer engine and records no kernel symbols. $REASON"
            fi
          }
          ensure_sysctl kernel.perf_event_paranoid 1 le
          ensure_sysctl kernel.kptr_restrict 0 eq

      - name: Run the benchmark
        working-directory: ./timefold-solver-benchmarks
        shell: bash
        env:
          TIMEFOLD_LICENSE: ${{ secrets.TIMEFOLD_SOLVER_CI_PROD_LICENSE }}
        run: |
          # RUN_ID may hold a slash, so each fork writes its own results.json and its own JFR
          # instead of overwriting the one before it.
          mkdir -p logs
          run_fork() { # side, fork id
            case $1 in
              baseline) HOME_DIR=$JAVA_HOME_BASELINE; RESULT_DIR=$BASELINE_DIR ;;
              sut) HOME_DIR=$JAVA_HOME_SUT; RESULT_DIR=$SUT_DIR ;;
            esac
            RESULT_FILE="results/scoredirector/$RESULT_DIR/fork-$2/results.json"
            LOG="logs/$1-fork-$2.log"
            for ATTEMPT in 1 2; do
              STARTED=$SECONDS
              # Every one of these invocations is a single fork, which JMH announces as
              # "Fork: 1 of 1", so its output cannot say how far along the run is.
              # Keep it in a file and print one line for each fork instead.
              JAVA_HOME="$HOME_DIR" BENCHMARK_JAR="benchmarks-$1.jar" RUN_ID="$RESULT_DIR/fork-$2" \
                  ./run-scoredirector.sh --skip-flamegraphs > "$LOG" 2>&1 || true
              # JMH does not fail the process when a benchmark trial errors out - it just omits it
              # from the results, so a crashed run can still exit 0.
              if [ -s "$RESULT_FILE" ]; then
                printf '%10s fork %3d / %3d: %8.0f ops/s in %3d s\n' "$1" "$2" "$FORK_COUNT" \
                    "$(jq -r '.[0].primaryMetric.score' "$RESULT_FILE")" "$((SECONDS - STARTED))"
                return 0
              fi
              # A retried fork runs later than its partner on the other side, which weakens the
              # pairing that the alternation exists to create. Say so loudly, with the evidence:
              # this is the only place that log is ever read.
              echo "::warning::The $1 fork-$2 produced no results on attempt $ATTEMPT."
              tail -n 30 "$LOG"
            done
            echo "::error::The $1 fork-$2 produced no results, even after a retry."
            exit 1
          }
          for FORK in $(seq -w 1 "$FORK_COUNT"); do
            run_fork baseline "$FORK"
            run_fork sut "$FORK"
          done

      - name: Merge the results
        working-directory: ./timefold-solver-benchmarks
        shell: bash
        env:
          JDK_BASELINE: ${{ github.event.inputs.jdk_baseline }}
          JDK_BRANCH: ${{ github.event.inputs.jdk_branch }}
        run: |
          merge_side() { # side, result dir, results file, requested major version
            COUNT=$(find "results/scoredirector/$2" -name results.json | wc -l)
            if [ "$COUNT" -ne "$FORK_COUNT" ]; then
              echo "::error::The $1 side produced $COUNT/$FORK_COUNT fork results."
              exit 1
            fi
            python3 merge-scoredirector-results.py \
                results/scoredirector/"$2"/fork-*/results.json --output "$3" --expect-jdk "$4"
            COUNT=$(jq 'length' "$3")
            if [ "$COUNT" -ne 1 ]; then
              echo "::error::The $1 side merged to $COUNT/1 benchmark results."
              exit 1
            fi
            # JMH names every fork's recording jfr-cpu.jfr in one directory for each benchmark,
            # with no fork index, so a single multi-fork run kept only the last fork's profile.
            # Concatenated recordings are one valid multi-chunk file, in which chunk N is fork N
            # byte for byte, so nothing is lost by keeping only the merge:
            #   jfr disassemble --max-chunks 1 --output <dir> jfr-cpu.jfr
            RECORDINGS=$(find "results/scoredirector/$2" -path '*/fork-*/*' -name 'jfr-cpu.jfr' | sort)
            if [ -z "$RECORDINGS" ]; then
              # Only happens when the async profiler could not be loaded; it warns and carries on.
              echo "::warning::The $1 side produced no JFR recordings."
              return 0
            fi
            echo "$RECORDINGS" | xargs cat > "results/scoredirector/$2/jfr-cpu.jfr"
            echo "$RECORDINGS" | xargs rm
            # One fork holds too few samples to draw a useful flame graph, so the graphs are made
            # here, once, from the merge. The per-fork recordings are gone, so the conversion
            # finds exactly this one file.
            JAVA_HOME="$5" BENCHMARK_JAR="benchmarks-$1.jar" RUN_ID="$2" \
                ./run-scoredirector.sh --flamegraphs-only
          }
          merge_side baseline "$BASELINE_DIR" baseline-results.json "$JDK_BASELINE" "$JAVA_HOME_BASELINE"
          merge_side sut "$SUT_DIR" sut-results.json "$JDK_BRANCH" "$JAVA_HOME_SUT"

      - name: Verify what actually ran
        working-directory: ./timefold-solver-benchmarks
        shell: bash
        env:
          JDK_BASELINE: ${{ github.event.inputs.jdk_baseline }}
          JDK_BRANCH: ${{ github.event.inputs.jdk_branch }}
        run: |
          # JMH records the JVM that ran the benchmark, which is evidence, unlike the environment
          # this job set up for it.
          BASELINE_JVM=$(jq -r '.[0].jvm' baseline-results.json)
          SUT_JVM=$(jq -r '.[0].jvm' sut-results.json)
          echo "baseline ran on $BASELINE_JVM"
          echo "sut ran on $SUT_JVM"
          if [ "$JDK_BASELINE" = "$JDK_BRANCH" ] && [ "$BASELINE_JVM" != "$SUT_JVM" ]; then
            echo "::error::One JDK was requested for both sides, but they ran on different JVMs."
            exit 1
          fi
          if [ "$JDK_BASELINE" != "$JDK_BRANCH" ] && [ "$BASELINE_JVM" = "$SUT_JVM" ]; then
            echo "::error::Different JDKs were requested, but one JVM ran both sides."
            exit 1
          fi

      # Uploaded before "Archive benchmark data" (and given an id)
      # so its artifact-url output can be recorded into a file
      # and ride along inside the data-* artifact -
      # that's the only artifact the summarize job downloads,
      # so this is how a row in its table can link straight to these assets.
      - name: Archive benchmark assets
        id: archive_assets
        uses: actions/upload-artifact@v7
        with:
          name: assets-${{ matrix.example }}
          # The recording and its flame graphs now sit directly in the side's directory, one file
          # for each side; the fork-* subdirectories below it hold only results.json.
          path: |
            ./timefold-solver-benchmarks/results/scoredirector/${{ env.BASELINE_DIR }}/*.jfr
            ./timefold-solver-benchmarks/results/scoredirector/${{ env.BASELINE_DIR }}/*.html
            ./timefold-solver-benchmarks/results/scoredirector/${{ env.SUT_DIR }}/*.jfr
            ./timefold-solver-benchmarks/results/scoredirector/${{ env.SUT_DIR }}/*.html
          if-no-files-found: warn

      # Empty when the step above found no assets (if-no-files-found: warn uploads nothing, so
      # artifact-url is unset); summarize-scoredirector.py treats an empty/missing file as "no link".
      - name: Record the assets artifact URL
        shell: bash
        run: |
          echo "${{ steps.archive_assets.outputs.artifact-url }}" > ./timefold-solver-benchmarks/assets-url.txt

      - name: Archive benchmark data
        uses: actions/upload-artifact@v7
        with:
          name: data-${{ matrix.example }}
          path: |
            ./timefold-solver-benchmarks/scoredirector-benchmark.properties
            ./timefold-solver-benchmarks/baseline-results.json
            ./timefold-solver-benchmarks/sut-results.json
            ./timefold-solver-benchmarks/assets-url.txt
          if-no-files-found: error

  report:
    needs: [ decisions, benchmark ]
    if: always() && needs.decisions.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout timefold-solver-benchmarks
        uses: actions/checkout@v7
        with:
          path: ./timefold-solver-benchmarks
          # Same reason as the benchmark job: the summarizer has to come from the commit
          # that dispatched this run, or a change to it is never exercised before it is merged.
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Download the benchmark data
        uses: actions/download-artifact@v8
        with:
          pattern: data-*
          path: ./data

      - name: Summarize the results
        working-directory: ./timefold-solver-benchmarks
        shell: bash
        env:
          EXAMPLES: ${{ needs.decisions.outputs.examples }}
          BASELINE: ${{ github.event.inputs.baseline }}
          BRANCH: ${{ github.event.inputs.branch }}
          OWNER: ${{ github.event.inputs.branch_owner }}
        run: |
          python3 summarize-scoredirector.py ../data \
            --expect "$EXAMPLES" --baseline "$BASELINE" --branch "$BRANCH" --owner "$OWNER" \
            >> "$GITHUB_STEP_SUMMARY"
