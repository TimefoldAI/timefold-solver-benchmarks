# Both baseline and SUT (Software Under Test) are built from source first,
# with their binaries uploaded as artifacts.
# This is done on GitHub infrastructure, to achieve maximum parallelization.
#
# The benchmark job downloads the binaries and runs them.
# The baseline is established first, then the SUT is measured.
# They both run in the same job,
# to guarantee they run on the same machine with the same performance characteristics.
# This is done on a GitHub-hosted Arm runner, same as the other benchmarks.
#
# Each benchmark gives a 99.9 % confidence interval.
# The report job joins all quickstarts into one table (summarize-quickstarts.py);
# it compares the confidence intervals to determine if the branch under test is a regression or an improvement.
#
name: Quickstart Perf Regression Test
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      jdk_baseline:
        description: 'JDK version'
        default: '27'
        required: true
      baseline:
        description: 'Baseline branch or tag'
        default: 'v2.8.0'
        required: true
      jdk_branch:
        description: 'JDK version'
        default: '27'
        required: true
      branch:
        description: 'Branch to benchmark (needs to use 999-SNAPSHOT)'
        default: 'main'
        required: true
      branch_owner:
        description: 'User owning the branch'
        default: 'TimefoldAI'
        required: true
      runs:
        description: 'Solver runs per quickstart per version'
        default: '20'
        required: false
      time_limit:
        description: 'Solver time limit per run in seconds'
        default: '60'
        required: false

run-name: "TimefoldAI's ${{ github.event.inputs.baseline }} vs. ${{ github.event.inputs.branch_owner }}'s ${{ github.event.inputs.branch }} (Java ${{ github.event.inputs.jdk_baseline }} vs. ${{ github.event.inputs.jdk_branch }})"

jobs:
  decisions:
    runs-on: ubuntu-latest
    outputs:
      quickstarts: ${{ steps.enumerate.outputs.quickstarts }}
    steps:
      # Single source of truth for the benchmark matrix and for the summarizing job.
      - name: Enumerate quickstarts
        id: enumerate
        shell: bash
        run: |
          QUICKSTARTS='["bed-allocation","conference-scheduling","employee-scheduling","facility-location","flight-crew-scheduling","food-packaging","maintenance-scheduling","meeting-scheduling","order-picking","project-job-scheduling","school-timetabling","sports-league-scheduling","task-assigning","tournament-scheduling","vehicle-routing"]'
          echo "quickstarts=$QUICKSTARTS" >> "$GITHUB_OUTPUT"

  build_baseline:
    needs: decisions
    runs-on: ubuntu-latest # Leverage massive parallelization of Github-hosted runners.
    strategy:
      fail-fast: true # If one compilation fails, abort everything.
      matrix:
        example: ${{ fromJSON(needs.decisions.outputs.quickstarts) }}
    steps:
      - name: Checkout timefold-quickstarts
        uses: actions/checkout@v7
        with:
          repository: TimefoldAI/timefold-quickstarts
          path: ./timefold-quickstarts
          ref: development

      - name: Setup JDK and Maven
        uses: actions/setup-java@v6.2.0
        with:
          java-version: 25 # Always build with the least recent supported JDK.
          distribution: 'temurin'
          cache: 'maven'

      - name: Checkout timefold-solver
        uses: actions/checkout@v7
        with:
          repository: TimefoldAI/timefold-solver
          ref: ${{ github.event.inputs.baseline }}
          path: ./timefold-solver

      - name: Quickly build timefold-solver
        working-directory: ./timefold-solver
        shell: bash
        run: ./mvnw -B -Dquickly -Drevision=999-SNAPSHOT clean install

      - name: Checkout timefold-solver-enterprise
        uses: actions/checkout@v7
        with:
          repository: TimefoldAI/timefold-solver-enterprise
          ref: ${{ github.event.inputs.baseline }}
          token: ${{ secrets.BENCHMARK_PUBLISH_TOKEN }}
          path: ./timefold-solver-enterprise

      - name: Quickly build timefold-solver-enterprise
        working-directory: ./timefold-solver-enterprise
        shell: bash
        run: ./mvnw -B -Dquickly -Drevision=999-SNAPSHOT clean install

      - name: Switch quickstarts to baseline branch if it exists
        working-directory: ./timefold-quickstarts
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.inputs.baseline }}
        run: |
          # Match a branch OR a tag named $TARGET_BRANCH (no --heads): baseline is often a tag
          # (e.g. a release version), and quickstarts is tagged in lockstep with solver releases.
          # Falls back to the already-checked-out `development` if no match exists.
          if git ls-remote --exit-code origin "$TARGET_BRANCH" > /dev/null; then
            git fetch --depth=1 origin "$TARGET_BRANCH"
            git checkout -B "$TARGET_BRANCH" FETCH_HEAD
          fi
          git status

      - name: Build the quickstart
        shell: bash
        run: |
          mvn -B -DskipTests -Penterprise package \
            -f timefold-quickstarts/use-cases/${{ matrix.example }}/pom.xml

      - name: Upload the binaries
        uses: actions/upload-artifact@v7
        with:
          name: baseline-${{ matrix.example }}
          path: |
            ./timefold-quickstarts/use-cases/${{ matrix.example }}/target/quarkus-app/
          if-no-files-found: error

  build_sut:
    needs: decisions
    runs-on: ubuntu-latest # Leverage massive parallelization of Github-hosted runners.
    strategy:
      fail-fast: true # If one compilation fails, abort everything.
      matrix:
        example: ${{ fromJSON(needs.decisions.outputs.quickstarts) }}
    steps:
      - name: Checkout timefold-quickstarts
        uses: actions/checkout@v7
        with:
          repository: TimefoldAI/timefold-quickstarts
          path: ./timefold-quickstarts
          ref: development

      - name: Setup JDK and Maven
        uses: actions/setup-java@v6.2.0
        with:
          java-version: 25 # Always build with the least recent supported JDK.
          distribution: 'temurin'
          cache: 'maven'

      - name: Checkout timefold-solver
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.inputs.branch_owner }}/timefold-solver
          ref: ${{ github.event.inputs.branch }}
          path: ./timefold-solver

      - name: Quickly build timefold-solver
        working-directory: ./timefold-solver
        shell: bash
        run: ./mvnw -B -Dquickly -Drevision=999-SNAPSHOT clean install

      - name: Checkout timefold-solver-enterprise
        uses: actions/checkout@v7
        with:
          repository: TimefoldAI/timefold-solver-enterprise
          ref: main
          token: ${{ secrets.BENCHMARK_PUBLISH_TOKEN }}
          path: ./timefold-solver-enterprise

      - name: Switch timefold-solver-enterprise to branch under test if it exists
        working-directory: ./timefold-solver-enterprise
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          # Match a branch OR a tag named $TARGET_BRANCH (no --heads): the branch under test may
          # also be a tag. Falls back to the already-checked-out `main` if no match exists.
          if git ls-remote --exit-code origin "$TARGET_BRANCH" > /dev/null; then
            git fetch --depth=1 origin "$TARGET_BRANCH"
            git checkout -B "$TARGET_BRANCH" FETCH_HEAD
          fi
          git status

      - name: Quickly build timefold-solver-enterprise
        working-directory: ./timefold-solver-enterprise
        shell: bash
        run: ./mvnw -B -Dquickly -Drevision=999-SNAPSHOT clean install

      - name: Switch quickstarts to branch under test if it exists
        working-directory: ./timefold-quickstarts
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          # Match a branch OR a tag named $TARGET_BRANCH (no --heads): the branch under test may
          # also be a tag, and quickstarts is tagged in lockstep with solver releases.
          # Falls back to the already-checked-out `development` if no match exists.
          if git ls-remote --exit-code origin "$TARGET_BRANCH" > /dev/null; then
            git fetch --depth=1 origin "$TARGET_BRANCH"
            git checkout -B "$TARGET_BRANCH" FETCH_HEAD
          fi
          git status

      - name: Build the quickstart
        shell: bash
        run: |
          mvn -B -DskipTests -Penterprise package \
            -f timefold-quickstarts/use-cases/${{ matrix.example }}/pom.xml

      - name: Upload the binaries
        uses: actions/upload-artifact@v7
        with:
          name: sut-${{ matrix.example }}
          path: |
            ./timefold-quickstarts/use-cases/${{ matrix.example }}/target/quarkus-app/
          if-no-files-found: error

  benchmark:
    needs: [ decisions, build_baseline, build_sut ]
    runs-on: ubuntu-24.04-arm # Github-hosted Arm runner; free and GA for this public repo.
    timeout-minutes: 300
    strategy:
      fail-fast: false # The report job gives the verdict; one broken quickstart must not hide the others.
      matrix:
        example: ${{ fromJSON(needs.decisions.outputs.quickstarts) }}
    steps:
      - name: Clean results of previous runs
        shell: bash
        env:
          BASELINE: ${{ github.event.inputs.baseline }}
          BRANCH: ${{ github.event.inputs.branch }}
        run: |
          # DIRs are different, so that we can run "main" against "main" and have separate results.
          # Strip CR/LF from inputs before writing to $GITHUB_ENV to prevent env-file injection.
          SANITIZED_BASELINE=$(echo "$BASELINE" | tr -d '\r\n' | sed 's/\//\-/g')
          SANITIZED_BRANCH=$(echo "$BRANCH" | tr -d '\r\n' | sed 's/\//\-/g')
          {
            echo "SANITIZED_BASELINE=$SANITIZED_BASELINE"
            echo "SANITIZED_BRANCH=$SANITIZED_BRANCH"
          } >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: 'x'

      - name: Checkout timefold-solver-benchmarks
        uses: actions/checkout@v7
        with:
          repository: TimefoldAI/timefold-solver-benchmarks
          path: ./timefold-solver-benchmarks
          # The harness has to come from the commit that dispatched this run,
          # or a change to it is never exercised before it is merged.
          ref: ${{ github.sha }}

      - name: Download the baseline binaries
        uses: actions/download-artifact@v8
        with:
          name: baseline-${{ matrix.example }}
          path: ./baseline-app

      - name: Download the SUT binaries
        uses: actions/download-artifact@v8
        with:
          name: sut-${{ matrix.example }}
          path: ./sut-app

      - name: (Baseline) Setup JDK
        uses: actions/setup-java@v6.2.0
        with:
          java-version: ${{ github.event.inputs.jdk_baseline }}
          distribution: 'temurin'
          check-latest: true

      - name: (Baseline) Run the benchmark
        shell: bash
        env:
          TIMEFOLD_LICENSE: ${{ secrets.TIMEFOLD_SOLVER_CI_PROD_LICENSE }}
          RUNS: ${{ github.event.inputs.runs }}
          TIME_LIMIT: ${{ github.event.inputs.time_limit }}
        run: |
          python3 timefold-solver-benchmarks/benchmark-quickstarts.py \
            ${{ matrix.example }} ./baseline-app \
            --runs $RUNS \
            --time-limit $TIME_LIMIT \
            --output baseline.csv \
            --jfr-dir jfr-baseline
          # One file for each side; JFR chunks concatenate into a valid recording.
          RECORDINGS=$(find jfr-baseline -name '*.jfr' | sort)
          if [ -z "$RECORDINGS" ]; then
            echo "::warning::The baseline side produced no JFR recordings."
          else
            echo "$RECORDINGS" | xargs cat > baseline.jfr
          fi

      - name: (SUT) Setup JDK
        uses: actions/setup-java@v6.2.0
        with:
          java-version: ${{ github.event.inputs.jdk_branch }}
          distribution: 'temurin'
          check-latest: true

      - name: (SUT) Run the benchmark
        shell: bash
        env:
          TIMEFOLD_LICENSE: ${{ secrets.TIMEFOLD_SOLVER_CI_PROD_LICENSE }}
          RUNS: ${{ github.event.inputs.runs }}
          TIME_LIMIT: ${{ github.event.inputs.time_limit }}
        run: |
          python3 timefold-solver-benchmarks/benchmark-quickstarts.py \
            ${{ matrix.example }} ./sut-app \
            --runs $RUNS \
            --time-limit $TIME_LIMIT \
            --output sut.csv \
            --jfr-dir jfr-sut
          # One file for each side; JFR chunks concatenate into a valid recording.
          RECORDINGS=$(find jfr-sut -name '*.jfr' | sort)
          if [ -z "$RECORDINGS" ]; then
            echo "::warning::The sut side produced no JFR recordings."
          else
            echo "$RECORDINGS" | xargs cat > sut.jfr
          fi

      # Uploaded before "Archive benchmark data" (and given an id)
      # so its artifact-url output can be recorded into a file
      # and ride along inside the data-* artifact -
      # that's the only artifact the report job downloads,
      # so this is how a row in its table can link straight to these assets.
      # The archive steps also run after a failed benchmark step,
      # so the report still gets whatever the job measured.
      - name: Archive benchmark assets
        id: archive_assets
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: assets-${{ matrix.example }}
          path: |
            ./baseline.jfr
            ./sut.jfr
          if-no-files-found: warn

      # Empty when the step above found no assets; summarize-quickstarts.py treats that as "no link".
      - name: Record the assets artifact URL
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          echo "${{ steps.archive_assets.outputs.artifact-url }}" > assets-url.txt

      - name: Archive benchmark data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: data-${{ matrix.example }}
          path: |
            ./baseline.csv
            ./sut.csv
            ./assets-url.txt
          if-no-files-found: error

  report:
    needs: [ decisions, benchmark ]
    if: always() && needs.decisions.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout timefold-solver-benchmarks
        uses: actions/checkout@v7
        with:
          path: ./timefold-solver-benchmarks
          # Same reason as the benchmark job: the summarizer has to come from the commit
          # that dispatched this run, or a change to it is never exercised before it is merged.
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Download the benchmark data
        uses: actions/download-artifact@v8
        with:
          pattern: data-*
          path: ./data

      - name: Summarize the results
        working-directory: ./timefold-solver-benchmarks
        shell: bash
        env:
          QUICKSTARTS: ${{ needs.decisions.outputs.quickstarts }}
          BASELINE: ${{ github.event.inputs.baseline }}
          BRANCH: ${{ github.event.inputs.branch }}
          OWNER: ${{ github.event.inputs.branch_owner }}
        run: |
          python3 summarize-quickstarts.py ../data \
            --expect "$QUICKSTARTS" --baseline "$BASELINE" --branch "$BRANCH" --owner "$OWNER" \
            >> "$GITHUB_STEP_SUMMARY"
