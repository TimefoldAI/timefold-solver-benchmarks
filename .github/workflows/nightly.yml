name: Schedule a nightly run

on:
  schedule:
    - cron: '0 20 * * *' # Every day at 10pm CEST (8pm UTC).

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout timefold-solver
        uses: actions/checkout@v7
        with:
          path: ./timefold-solver
          repository: TimefoldAI/timefold-solver
          # Full history without file contents, so that "git log --since" sees every commit of the past day.
          fetch-depth: 0
          filter: blob:none
      # All workflows run on Github-hosted runners, one job per runner, so they cannot interfere with each other.
      - name: Schedule the other workflows
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BENCHMARK_PUBLISH_TOKEN }}
        run: |
          # No pipe into "grep -q": under pipefail, git's SIGPIPE after grep exits would read as "nothing changed".
          changed() { [ -n "$(git -C timefold-solver log -1 --since="24 hours ago" --format=%H -- "$@")" ]; }
          launch() {
            echo '{}' | gh workflow run "$1" --json --repo TimefoldAI/timefold-solver-benchmarks
            echo "Launched nightly $2." >> $GITHUB_STEP_SUMMARY
          }
          launched=false
          launch_if_changed() {
            local workflow=$1 description=$2
            shift 2
            if changed "$@"; then
              launch "$workflow" "$description"
              launched=true
            fi
          }
          CORE=core/src/main/java/ai/timefold/solver/core
          # Core (and "build", which holds the BOM) affects every whole-solver benchmark;
          # Quarkus integration and the service module only affect the quickstarts.
          launch_if_changed turtle.yml "turtle tests" core build
          launch_if_changed performance_quickstarts.yml "quickstart perf tests" core build quarkus-integration service
          # The microbenchmarks only run when the code they measure changes.
          launch_if_changed performance_score_director.yml "score director perf tests" \
            "$CORE/impl/bavet" "$CORE/impl/score"
          # Move providers: their streams run on the Bavet nodes in impl/bavet/common,
          # and every committed move runs through the score director.
          launch_if_changed performance_move_provider.yml "move provider perf tests" \
            "$CORE/impl/neighborhood" "$CORE/preview/api/neighborhood" "$CORE/impl/move" "$CORE/preview/api/move" \
            "$CORE/impl/bavet/common" "$CORE/impl/score/director"
          # Only Neighborhoods code changes this comparison often enough to pay for it.
          launch_if_changed performance_neighborhoods.yml "move selectors vs. Neighborhoods tests" \
            "$CORE/impl/neighborhood" "$CORE/impl/move/builtin" "$CORE/impl/bavet/common" \
            "$CORE/preview/api/neighborhood" "$CORE/preview/api/move/builtin"
          if [ "$launched" = false ]; then
            # Don't waste money.
            echo "No commits to the benchmarked code in the past 24 hours." >> $GITHUB_STEP_SUMMARY
          fi
