name: Schedule a nightly run

on:
  schedule:
    - cron: '0 20 * * *' # Every day at 10pm CEST (8pm UTC).

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout timefold-solver
        uses: actions/checkout@v7
        with:
          path: ./timefold-solver
          repository: TimefoldAI/timefold-solver
          # Full history without file contents, so that "git log --since" sees every commit of the past day.
          fetch-depth: 0
          filter: blob:none
      # All workflows run on Github-hosted runners, one job per runner, so they cannot interfere with each other.
      - name: Schedule the other workflows
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BENCHMARK_PUBLISH_TOKEN }}
        run: |
          changed() { git -C timefold-solver log --since="24 hours ago" --oneline -- "$@" | grep -q .; }
          launch() {
            echo '{}' | gh workflow run "$1" --json --repo TimefoldAI/timefold-solver-benchmarks
            echo "Launched nightly $2." >> $GITHUB_STEP_SUMMARY
          }
          # Core (and "build", which holds the BOM) affects every benchmark;
          # Quarkus integration and the service module only affect the quickstarts.
          if changed core build; then
            launch turtle.yml "turtle tests"
            launch performance_score_director.yml "score director perf tests"
            launch performance_move_provider.yml "move provider perf tests"
            launch performance_quickstarts.yml "quickstart perf tests"
          elif changed quarkus-integration service; then
            launch performance_quickstarts.yml "quickstart perf tests"
          else
            # Don't waste money.
            echo "No commits to the benchmarked modules in the past 24 hours." >> $GITHUB_STEP_SUMMARY
          fi
